name: Bug
description: Báo lỗi kèm bước tái hiện.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Chọn label type:bug và area/module, priority, size đang có. Không gửi token hoặc thông tin bí mật."
  - type: textarea
    id: reproduce
    attributes:
      label: Các bước tái hiện
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Kết quả mong đợi và thực tế
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Môi trường và bằng chứng
      description: Commit, thiết bị/Android hoặc Java/Node/Expo, log và ảnh đã loại bỏ dữ liệu nhạy cảm.
    validations:
      required: true
