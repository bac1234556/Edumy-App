name: Chore / Task
description: Công việc hạ tầng, tài liệu hoặc bảo trì.
title: "[Chore] "
body:
  - type: markdown
    attributes:
      value: "Chọn label type:chore (hoặc type:docs/type:test) và area/module, priority, size đang có."
  - type: textarea
    id: scope
    attributes:
      label: Mục tiêu và phạm vi
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Checklist nghiệm thu và cách xác minh
      placeholder: "- [ ] Kết quả có bằng chứng kiểm tra"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Phụ thuộc / thao tác GitHub cần quyền owner
