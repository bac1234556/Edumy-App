name: Android preview
on:
  pull_request:
    branches: [develop]
    paths:
      - 'mobile/eas.json'
      - 'mobile/app.json'
      - 'mobile/assets/**'
      - 'mobile/scripts/android_auth_smoke.py'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Auth integration tests and backend package
        working-directory: backend
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: preview-backend
          path: backend/target/edumy-backend-0.0.1-SNAPSHOT.jar
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build bundled internal emulator APK
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8080/api
          CI: 'true'
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          p.write_text(p.read_text().replace('<application ', '<application android:usesCleartextTraffic="true" ', 1))
          PY
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: edumy-emulator-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 31, 33, 35]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: edumy_ci
          MYSQL_USER: edumy_ci
          MYSQL_PASSWORD: ci-test-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: edumy_ci
      DB_USER: edumy_ci
      DB_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: preview-backend
          path: preview-backend
      - uses: actions/download-artifact@v4
        with:
          name: edumy-emulator-apk
          path: preview-apk
      - name: Start isolated backend
        run: |
          java -jar preview-backend/*.jar > backend-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install preview-apk/*.apk
            python3 mobile/scripts/android_auth_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-api-${{ matrix.api }}
          path: |
            android-smoke/
            backend-preview.log
