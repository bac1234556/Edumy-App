name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check repository structure and CI bootstrap behavior
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check backend prerequisites
        id: project
        run: bash .github/scripts/check-project.sh backend
      - uses: actions/setup-java@v4
        if: steps.project.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Maven verification
        if: steps.project.outputs.present == 'true'
        working-directory: backend
        run: ./mvnw -B verify

  mobile:
    name: Mobile lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check mobile prerequisites
        id: project
        run: bash .github/scripts/check-project.sh mobile
      - uses: actions/setup-node@v4
        if: steps.project.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        if: steps.project.outputs.present == 'true'
        working-directory: mobile
        run: npm ci
      - name: Lint
        if: steps.project.outputs.present == 'true'
        working-directory: mobile
        env:
          CI: 'true'
        run: npm run lint
