name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: edumy_ci
          MYSQL_USER: edumy_ci
          MYSQL_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: edumy_ci
      DB_USER: edumy_ci
      DB_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend tests and package
        run: ./mvnw -B verify
      - name: Smoke test real MySQL migrations and auth HTTP flow
        run: |
          java -jar target/edumy-backend-0.0.1-SNAPSHOT.jar > "$RUNNER_TEMP/backend-smoke.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo 'Backend failed to become ready; see backend-smoke artifact.' >&2
            exit 1
          fi
          python3 scripts/smoke_auth.py --check-seeded-admin
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
      - name: Upload backend smoke log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-log
          path: ${{ runner.temp }}/backend-smoke.log
          if-no-files-found: ignore

  mobile:
    name: Mobile verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        env:
          CI: 'true'
        run: npm run lint
      - name: Test auth and secure session
        run: npm test -- --runInBand
      - name: Export Android bundle
        env:
          CI: 'true'
          EXPO_OFFLINE: '1'
        run: npx expo export --platform android --output-dir dist --max-workers 2
