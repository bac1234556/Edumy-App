# Isolated application tests. Production MySQL/Flyway configuration is unchanged.
# MySQL migrations require a separate integration workflow under Issue #3.
spring.datasource.url=jdbc:h2:mem:edumy-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
