services:
  mysql:
    image: mysql:8.0
    container_name: edumy-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-edumy_local_root}
      MYSQL_DATABASE: ${DB_NAME:-edumy_db}
      MYSQL_USER: ${DB_USER:-edumy_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-edumy_password}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
